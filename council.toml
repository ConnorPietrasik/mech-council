# council.toml — the councils this project convenes.
# Knobs not stated here take their built-in defaults.
#
# `extends` inherits another council's roster, chair and knobs wholesale.  A council that
# then states `[[agents]]` patches the inherited seats by name — a stated key replaces it,
# the rest carry over, `drop = true` retires a seat, and a name the parent lacks joins the
# end — and `[chair]` merges key by key.  Precedence: built-in, `[defaults]`, the extended
# chain nearest-first, this council, the flags.  A `_` name is a template: something to
# extend, never something you convene.
#
# `[providers.<name>]` caps one provider: `max_concurrency` is the total requests it takes
# at once, the chair's included, or "auto" to read the number the provider reports.  A
# provider the table never names is uncapped: every seat on it may be in flight at once.

[providers.omnissiah-qfn]
max_concurrency = "auto"

[councils.review]                   # `mech-council review` — the whole tree
mode = "review"
goal = "See if there is anything that should be fixed / improved in this project."

[councils.review.chair]
name = "Chair"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"

[[councils.review.agents]]
name = "Metic"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a meticulous code reviewer. Hunt for correctness bugs.
"""

[[councils.review.agents]]
name = "Senior"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a pragmatic senior engineer.
"""

[[councils.review.agents]]
name = "Pro"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a professional code reviewer.
"""

[[councils.review.agents]]
name = "Coworker"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a coworker of the author. Make sure the code is readable and correct so you won't hate working on it for future improvements / feature adds.
"""

[councils.review-sec]
extends = "review"

[[councils.review-sec.agents]]
name = "Secure"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a professional security engineer. Focus on finding security flaws, but engage with other seats' findings. State each flaw's severity accurately (no exaggerating).
"""

[councils.plan]
mode = "plan"
goal = "Make a plan for the implementation of the next TODO item"

[councils.plan.chair]
name = "Chair"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"

[[councils.plan.agents]]
name = "Metic"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"
persona = """
You are a meticulous planner. Attack the internal correctness of a plan: preconditions, step ordering, partially-applied migrations, and anything that breaks when a step lands out of order or half-runs.
"""

[[councils.plan.agents]]
name = "Senior"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a pragmatic senior engineer. Find the smallest change that actually satisfies the task, prefer deleting to adding, and commit to a decision instead of presenting a menu. Push back on plans that leave the risky step for last. Challenge feasibility wherever you see it, including in your own plan.
"""

[[councils.plan.agents]]
name = "Pro"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a professional architect on a planning council. Re-read the task before endorsing anything and make sure the plan satisfies every requirement.
"""

[[councils.plan.agents]]
name = "Coworker"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are the engineer who inherits this codebase in eighteen months. Flag migrations, data formats, compatibility shims and config drift that nobody will want to own later.
"""

[councils.plan-sec]
extends = "plan"

[[councils.plan-sec.agents]]
name = "Secure"
provider = "omnissiah-qfn"
model = "Qwen3.8-Flash-Next"
persona = """
You are a professional security engineer. Focus on making sure the plan works well without compromising security.
"""

[councils.build]                   # `mech-council build` — plan (plan crew), then build in place
mode = "implement"
goal = "Implement the next TODO item in this project."
planner = "plan"
reviewer = "review"

[councils.build.chair]
name = "Chair"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"

[[councils.build.agents]]
name = "Coder"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"
role = "code"
persona = """
You are the builder. Implement the stage exactly as the plan states it and re-run the stage's gate until it passes.
"""

[[councils.build.agents]]
name = "Writer"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"
role = "prose"
persona = """
You write the user-visible text the run ships.

## STYLE
Prohibit epanorthosis, litotes, and contrastive negation.
Em-dashes are forbidden in prose; some recommended alternatives are periods, commas, colons, or parentheses where appropriate.
"""

[councils.fixit]                   # `mech-council fixit` — review, gate, then fix and commit the agreed findings
mode = "fix"
review = "review"
reviewer = "review"

[councils.fixit.chair]
name = "Chair"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"

[[councils.fixit.agents]]
name = "Forge"
provider = "omnissiah-27b"
model = "Qwen3.8-27B"
persona = """
You are the builder. Plan the one finding you hold, build it, and satisfy the finding's gate — run it, or verify its condition — until it passes.
"""
