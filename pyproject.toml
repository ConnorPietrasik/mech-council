[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mech-council"
description = "A council of coding agents that reviews a project, plans a task, implements one — or fixes a review's findings."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Connor Pietrasik", email = "connorgpietrasik@gmail.com" }]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["code-review", "multi-agent", "pi", "planning"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ConnorPietrasik/mech-council"
Repository = "https://github.com/ConnorPietrasik/mech-council"
Issues = "https://github.com/ConnorPietrasik/mech-council/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "pytest-xdist"]
dev = ["ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
mech-council = "mech_council.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Single-sourced: `--version` reads the same attribute.
[tool.setuptools.dynamic]
version = { attr = "mech_council.__version__" }

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
required-version = "==0.17.2"
line-length = 140
extend-exclude = ["testdata"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501", "W291", "W292", "W293", "W605",
          "RUF100", "PLW1510", "SIM115"]

[tool.ruff.lint.per-file-ignores]
# The transcript and stderr handles are opened once and live for the whole run, so a
# context manager would be a lie about their lifetime.
"src/mech_council/console.py" = ["SIM115"]
# STARTER is a TOML document: its line layout is the starter file the user edits, and
# reflowing a persona would change what the seats are briefed with.
"src/mech_council/init_config.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -n auto -p no:cacheprovider"
timeout = 120
timeout_method = "signal"
# xdist workers are multi-threaded (execnet), and the suite forks from them (tests/support/namespaces.py,
# test_sandbox.py); each fork comes from the test's own thread, the worker's other threads parked in C-level reads
filterwarnings = ["ignore:This process \\(pid=\\d+\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning"]
markers = [
    "slow: real-pi smoke test that spends tokens (deselected by default)",
    "sandbox: the overlay/mount family, needs plain-fs fixture ground",
]
