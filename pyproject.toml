[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mech-council"
version = "0.1.0"
description = "A council of coding agents that review a project or plan a task together."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Connor Pietrasik", email = "connorgpietrasik@gmail.com" }]
requires-python = ">=3.14"
dependencies = []
classifiers = ["Programming Language :: Python :: 3.14"]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]
dev = ["ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
mech-council = "mech_council.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
required-version = "==0.17.2"
line-length = 140
extend-exclude = ["testdata"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501", "W291", "W292", "W293", "W605",
          "RUF100", "PLW1510", "SIM115"]

[tool.ruff.lint.per-file-ignores]
# The transcript and stderr handles are opened once and live for the whole run, so a
# context manager would be a lie about their lifetime.
"src/mech_council/console.py" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -p no:cacheprovider"
timeout = 120
timeout_method = "signal"
markers = [
    "slow: real-pi smoke test that spends tokens (deselected by default)",
    "sandbox: the overlay/mount family, needs plain-fs fixture ground",
]
